<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渐变的边框</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0a0a0a;
            color: aliceblue;
        }
        .parent {
            padding: 1px;
            border-radius: 10px;
            background-image:linear-gradient(to right, #7f7fd5,#86a8e7,#91eae4);
        }
        .child {
            width: 150px;
            height: 200px;
            background-color: #0a0a0a;
            border-radius: 9px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">

        </div>
    </div>
</body>
</html>
