<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水平横向滚动列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .content {
            width: 100vw;
            background-color: pink;
            /* 不允许换行 */
            white-space: nowrap;
            /* 溢出显示滚动条 */
            overflow-x: auto;
            overflow-y: hidden;
        }
        .content .item {
            width: 100px;
            height: 100px;
            margin: 10px;
            background-color: red;
            display: inline-block;
        }
        /* 滚动条样式 */
        .content::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>
