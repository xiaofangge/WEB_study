<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>背景图片360度展示</title>
    <style>
      @property --angle {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      }
      .box {
        width: 300px;
        height: 300px;
        border-radius: 50%;
        mask: conic-gradient(#000 var(--angle), transparent var(--angle));
        -webkit-mask: conic-gradient(
          #000 var(--angle),
          transparent var(--angle)
        );
        animation: rotate 8s linear infinite;
        transition: background 0.5s;
        will-change: background, mask;
      }
      @keyframes rotate {
        0% {
          --angle: 0deg;
          background: url(../grid布局/images/img-05.jpg);
          background-size: cover;
          background-position: right;
        }
        25% {
          --angle: 360deg;
          background: url(../grid布局/images/img-05.jpg);
          background-size: cover;
           background-position: left;
        }
        25.01% {
          --angle: 0deg;
          background: url(../grid布局/images/img-02.jpg);
          background-size: cover;
          background-position: right;
        }
        50% {
          --angle: 360deg;
          background: url(../grid布局/images/img-02.jpg);
          background-size: cover;
          background-position: left;
        }
        50.01% {
          --angle: 0deg;
          background: url(../grid布局/images/img-04.jpg);
          background-size: cover;
          background-position: right;
        }
        75% {
          --angle: 360deg;
          background: url(../grid布局/images/img-04.jpg);
          background-size: cover;
          background-position: left;
        }
        75.01% {
          --angle: 0deg;
          background: url(../grid布局/images/img-07.jpg);
          background-size: cover;
          background-position: right;
        }
        100% {
          --angle: 360deg;
          background: url(../grid布局/images/img-07.jpg);
          background-size: cover;
          background-position: left;
        }
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
