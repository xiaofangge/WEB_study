<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>语法结构</title>
    <style>
      @property --color {
        /* syntax: 指定数据类型 */
        syntax: "<color>";
        /* inherits: false; */
        /* 是否必须改属性被继承 */
        inherits: true;
        /* 初始值 */
        initial-value: red;
      }
      :root {
        --color: blue;
      }
      .box {
        width: 300px;
        height: 300px;
        background-color: var(--color);
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
