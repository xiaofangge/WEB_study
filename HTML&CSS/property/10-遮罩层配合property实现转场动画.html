<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>遮罩层配合property实现转场动画</title>
    <style>
      @property --progress {
        syntax: "<percentage>";
        inherits: false;
        initial-value: 0%;
      }
      .box {
        width: 300px;
        height: 300px;
        background: url(../grid布局/images/img-07.jpg);
        background-size: cover;
        mask: linear-gradient(45deg, #000 var(--progress), transparent var(--progress));
        -webkit-mask: linear-gradient(45deg, #000 var(--progress), transparent var(--progress));
        animation: mask 2s linear infinite;
      }
      @keyframes mask {
        to {
          --progress: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
